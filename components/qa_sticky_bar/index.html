<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Ghim nút tài khoản</title>
  <script>
    /*
      Ghim nút tài khoản ở góc phải trên bằng JavaScript thay vì chỉ dựa vào CSS.

      Vì sao cần: CSS ghim theo class `.st-key-qa_account_bar` — class này do
      Streamlit sinh từ `st.container(key=...)`. Nếu bản Streamlit sau đổi cách
      đặt tên, hoặc một khối cha có `transform` làm "containing block", nút sẽ
      rơi về dòng thường. Ở đây ta đặt style **trực tiếp trên phần tử** (thắng
      stylesheet, không phụ thuộc thứ tự CSS), tìm phần tử bằng khớp một phần
      class (chịu được đổi tiền tố), và đo chiều cao thanh công cụ thật để
      không đè lên nút Fork/GitHub/menu.

      Component chạy ẩn (height 0). Mọi lỗi đều bỏ qua im lặng: CSS trong
      app.py vẫn là lớp dự phòng.
    */
    (function () {
      "use strict";

      var args = {};
      var timer = null;

      function findBar(doc, key) {
        // Khớp một phần class: "st-key-<key>" là quy ước có tài liệu của
        // Streamlit, nhưng vẫn chịu được việc đổi tiền tố.
        var all = doc.querySelectorAll('[class*="st-key-' + key + '"]');
        for (var i = 0; i < all.length; i++) {
          if (all[i].querySelector("button")) return all[i];
        }
        return all.length ? all[0] : null;
      }

      function toolbarBottom(doc) {
        var candidates = [
          '[data-testid="stAppToolbar"]',
          '[data-testid="stHeader"]',
          "header"
        ];
        for (var i = 0; i < candidates.length; i++) {
          var el = doc.querySelector(candidates[i]);
          if (!el) continue;
          var rect = el.getBoundingClientRect();
          if (rect.height > 0 && rect.bottom > 0 && rect.bottom < 200) {
            return Math.round(rect.bottom);
          }
        }
        return 48;   // chiều cao mặc định của thanh công cụ Streamlit
      }

      function stick() {
        try {
          var doc = window.parent.document;
          var key = args.key || "qa_account_bar";
          var bar = findBar(doc, key);
          if (!bar) return false;
          var top = toolbarBottom(doc) + (args.gap || 8);
          var s = bar.style;
          s.setProperty("position", "fixed", "important");
          s.setProperty("top", top + "px", "important");
          s.setProperty("right", (args.offset || 16) + "px", "important");
          s.setProperty("left", "auto", "important");
          s.setProperty("bottom", "auto", "important");
          s.setProperty("z-index", String(args.z || 999980), "important");
          s.setProperty("width", "fit-content", "important");
          s.setProperty("max-width", "calc(100vw - 32px)", "important");
          return true;
        } catch (err) {
          return false;
        }
      }

      function schedule() {
        if (timer) return;
        timer = window.setTimeout(function () {
          timer = null;
          stick();
        }, 120);
      }

      function start() {
        stick();
        try {
          var doc = window.parent.document;
          // Nút có thể được dựng lại sau mỗi lần Streamlit rerun: theo dõi DOM.
          var observer = new MutationObserver(schedule);
          observer.observe(doc.body, { childList: true, subtree: true });
          window.parent.addEventListener("resize", schedule);
        } catch (err) {
          /* khác origin hoặc bị chặn: CSS dự phòng lo phần còn lại */
        }
        // Vài nhịp đầu để bắt kịp lúc Streamlit vẽ xong khung trang.
        var ticks = 0;
        var boot = window.setInterval(function () {
          ticks += 1;
          stick();
          if (ticks > 12) window.clearInterval(boot);
        }, 500);
      }

      window.addEventListener("message", function (event) {
        var data = event && event.data;
        if (!data || data.type !== "streamlit:render") return;
        args = (data.args || {}).payload || {};
        start();
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: "streamlit:setFrameHeight" },
                        { height: 0 }),
          "*"
        );
      });

      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type: "streamlit:componentReady" },
                      { apiVersion: 1 }),
        "*"
      );
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  </style>
</head>
<body></body>
</html>
