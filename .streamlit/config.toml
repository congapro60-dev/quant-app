[theme]
font = "sans serif"

# Hai giao diện: mặc định theo thiết bị, người dùng đổi ở menu ⋮ → Settings → Theme.
# Màu riêng của ứng dụng nằm trong theme_ui.py.
[theme.light]
primaryColor = "#1D4ED8"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#E2E8F0"
textColor = "#0F172A"

[theme.dark]
primaryColor = "#1D4ED8"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111827"
textColor = "#F8FAFC"

[server]
maxUploadSize = 25
