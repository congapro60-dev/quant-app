[theme]
primaryColor = "#1D4ED8"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111827"
textColor = "#F8FAFC"
font = "sans serif"

[server]
maxUploadSize = 25

# TEMPORARY (deploy debugging): reveal the full traceback on the public error
# page so the ImportError Cloud-only failure can be diagnosed without dashboard
# access. Revert to "full" (default hides traceback) after the incident.
[client]
showErrorDetails = "stacktrace"
