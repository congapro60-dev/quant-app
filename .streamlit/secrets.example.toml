# MẪU SECRETS — KHÔNG PHẢI FILE BÍ MẬT THẬT
#
# Đây chỉ là mẫu ghi chú. Giá trị thật nhập ở dashboard Streamlit Cloud:
# Manage app → Settings → Secrets → dán nội dung → Save.
#
# Quy tắc bắt buộc (repo là công khai):
# - KHÔNG đặt khóa API thật vào bất kỳ tệp nào trong repo.
# - Tệp .streamlit/secrets.toml thật đã nằm trong .gitignore; dù vậy vẫn
#   không nên tạo dưới dạng tệp để tránh bấm nhầm commit.
#
# [shared_ai] là luồng AI dùng chung: học sinh không cần key riêng, app
# tự dùng cấu hình này làm mặc định. base_url là máy chủ tương thích
# giao thức OpenAI (kết thúc bằng /v1).

[shared_ai]
